        <section aria-label="Professional Profile">
          <h2>Professional Summary</h2>
          <p>Lauri is a product marketer who specializes in translating complex hardware security and open-source technology into market-ready narratives. Currently serving as Product Marketing Lead at <strong>Trezor</strong>, the original Bitcoin hardware wallet company, where he built the product marketing function from scratch and grew the team from zero to five.</p>

            <li>Product Marketing Leadership</li>

            <li>Product Positioning and Messaging</li>
            <li>Bitcoin, Crypto, and Web3 Security</li>
            <li>Technical Product Marketing</li>
            <li>B2B SaaS Marketing</li>
          </ul>
        </section>

        <section aria-label="Career History">

          <ul>
            <li><strong>Trezor</strong> — Product Marketing Lead (Jul 2024–Present); Senior Product Marketing Manager (Sep 2023–Jun 2024). Built the PMM department from 0 to 5, led GTM for Trezor Safe 7, Safe 5, Safe 5 Freedom Edition.</li>
            <li><strong>Product Marketing Alliance</strong> — Prague Chapter Lead (Nov 2023–Present); Brand Ambassador (Mar 2023–Nov 2023). Founded first PMA chapter in Prague, grew to 25+ members.</li>
            <li><strong>GoodData</strong> — Senior Technical Product Marketing Manager (Sep 2022–Sep 2023); Product Marketing Manager (Jan 2021–Aug 2022). Led team of 3, drove GTM for GoodData Cloud Platform and Cloud Native. Keynote speaker at KPMG Data Festival 2022.</li>
            <li><strong>Wunderman Thompson</strong> — Web Tagging Team Lead (Oct 2019–Dec 2020); Lead Management Specialist (Feb 2019–Oct 2019); Implementation Project Manager (May 2017–Feb 2019).</li>
            <li><strong>SQN (Sinequanon)</strong> — Client Delivery Specialist (Apr 2016–May 2017). Launched and managed AI-driven workplace culture programs for 25+ clients at a Swiss PeopleTech startup.</li>
            <li><strong>Finnish Defence Forces</strong> — Second Lieutenant / Mortar Platoon Commander. Ranked #1 of 700+ conscripts, top 5% graduate, Honorary Mortar Officer.</li>
